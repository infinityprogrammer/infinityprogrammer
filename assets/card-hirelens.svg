<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="HireLens">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F5AF0"/><stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.28"/><stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="560" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    .kicker { font: 700 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 2.5px; fill: #00D4FF; }
    .title  { font: 800 32px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #F0F6FC; }
    .body   { font: 400 16px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #9DA7B3; }
    .tag    { font: 600 12.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #E6EDF3; }
    .arrow  { font: 700 22px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: url(#g); }
    .shine  { animation: shine 5s ease-in-out infinite; }
    @keyframes shine { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="560" height="250" fill="#0D1117"/>
    <rect width="560" height="250" fill="url(#glow)" class="shine"/>
    <rect width="560" height="5" fill="url(#g)"/>
    <text x="28" y="44" class="kicker">RECRUITMENT PLATFORM</text>
    <text x="28" y="86" class="title">HireLens</text>
    <text x="530" y="86" text-anchor="end" class="arrow">↗</text>
    <text x="28" y="124" class="body">An open hiring platform on Frappe v16: a public job</text><text x="28" y="148" class="body">board, one-click apply with resume upload, and a</text><text x="28" y="172" class="body">private dashboard for hiring teams.</text>
    <g transform="translate(28 196)"><rect width="63" height="28" rx="14" fill="#42B883" fill-opacity="0.12" stroke="#42B883" stroke-opacity="0.55"/><circle cx="13" cy="14" r="4" fill="#42B883"/><text x="23" y="19" class="tag">Vue 3</text></g><g transform="translate(101 196)"><rect width="104" height="28" rx="14" fill="#0089FF" fill-opacity="0.12" stroke="#0089FF" stroke-opacity="0.55"/><circle cx="13" cy="14" r="4" fill="#0089FF"/><text x="23" y="19" class="tag">Frappe v16</text></g><g transform="translate(215 196)"><rect width="88" height="28" rx="14" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.55"/><circle cx="13" cy="14" r="4" fill="#38BDF8"/><text x="23" y="19" class="tag">Tailwind</text></g>
    <rect x="1" y="1" width="558" height="248" rx="17" fill="none" stroke="url(#g)" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="Agent Skills">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97757"/><stop offset="1" stop-color="#7F5AF0"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#7F5AF0" stop-opacity="0.28"/><stop offset="1" stop-color="#7F5AF0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="560" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    .kicker { font: 700 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 2.5px; fill: #7F5AF0; }
    .title  { font: 800 32px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #F0F6FC; }
    .body   { font: 400 16px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #9DA7B3; }
    .tag    { font: 600 12.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #E6EDF3; }
    .arrow  { font: 700 22px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: url(#g); }
    .shine  { animation: shine 5s ease-in-out infinite; }
    @keyframes shine { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="560" height="250" fill="#0D1117"/>
    <rect width="560" height="250" fill="url(#glow)" class="shine"/>
    <rect width="560" height="5" fill="url(#g)"/>
    <text x="28" y="44" class="kicker">AI AGENT SKILLS</text>
    <text x="28" y="86" class="title">Agent Skills</text>
    <text x="530" y="86" text-anchor="end" class="arrow">↗</text>
    <text x="28" y="124" class="body">Reusable skills for AI coding agents, like tracer-</text><text x="28" y="148" class="body">bullet development and spec slicing. Install with</text><text x="28" y="172" class="body">npx skills add infinityprogrammer/skills.</text>
    <g transform="translate(28 196)"><rect width="96" height="28" rx="14" fill="#D97757" fill-opacity="0.12" stroke="#D97757" stroke-opacity="0.55"/><circle cx="13" cy="14" r="4" fill="#D97757"/><text x="23" y="19" class="tag">AI Agents</text></g><g transform="translate(134 196)"><rect width="112" height="28" rx="14" fill="#C084FC" fill-opacity="0.12" stroke="#C084FC" stroke-opacity="0.55"/><circle cx="13" cy="14" r="4" fill="#C084FC"/><text x="23" y="19" class="tag">Claude Code</text></g><g transform="translate(256 196)"><rect width="96" height="28" rx="14" fill="#E6EDF3" fill-opacity="0.12" stroke="#E6EDF3" stroke-opacity="0.55"/><circle cx="13" cy="14" r="4" fill="#E6EDF3"/><text x="23" y="19" class="tag">skills.sh</text></g>
    <rect x="1" y="1" width="558" height="248" rx="17" fill="none" stroke="url(#g)" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>

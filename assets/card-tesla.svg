<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-label="Tesla ERP">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F8CFF"/><stop offset="1" stop-color="#FF4FD8"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#FF4FD8" stop-opacity="0.28"/><stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="560" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    .kicker { font: 700 12px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; letter-spacing: 2.5px; fill: #FF4FD8; }
    .title  { font: 800 32px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #F0F6FC; }
    .body   { font: 400 16px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: #9DA7B3; }
    .tag    { font: 600 12.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #E6EDF3; }
    .arrow  { font: 700 22px 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; fill: url(#g); }
    .shine  { animation: shine 5s ease-in-out infinite; }
    @keyframes shine { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="560" height="250" fill="#0D1117"/>
    <rect width="560" height="250" fill="url(#glow)" class="shine"/>
    <rect width="560" height="5" fill="url(#g)"/>
    <text x="28" y="44" class="kicker">ERP FINANCE</text>
    <text x="28" y="86" class="title">Tesla ERP</text>
    <text x="530" y="86" text-anchor="end" class="arrow">↗</text>
    <text x="28" y="124" class="body">A custom ERPNext app that adds Group General</text><text x="28" y="148" class="body">Ledger and Group Trial Balance reports for</text><text x="28" y="172" class="body">multi-company accounting.</text>
    <g transform="translate(28 196)"><rect width="71" height="28" rx="14" fill="#3776AB" fill-opacity="0.12" stroke="#3776AB" stroke-opacity="0.55"/><circle cx="13" cy="14" r="4" fill="#3776AB"/><text x="23" y="19" class="tag">Python</text></g><g transform="translate(109 196)"><rect width="79" height="28" rx="14" fill="#4F8CFF" fill-opacity="0.12" stroke="#4F8CFF" stroke-opacity="0.55"/><circle cx="13" cy="14" r="4" fill="#4F8CFF"/><text x="23" y="19" class="tag">ERPNext</text></g><g transform="translate(199 196)"><rect width="104" height="28" rx="14" fill="#F2C94C" fill-opacity="0.12" stroke="#F2C94C" stroke-opacity="0.55"/><circle cx="13" cy="14" r="4" fill="#F2C94C"/><text x="23" y="19" class="tag">Accounting</text></g>
    <rect x="1" y="1" width="558" height="248" rx="17" fill="none" stroke="url(#g)" stroke-opacity="0.5" stroke-width="2"/>
  </g>
</svg>
